apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stunner-operator
  namespace: argocd
spec:
  destination:
    namespace: stunner-system
    server: https://kubernetes.default.svc
  project: default
  sources:
    - repoURL: https://github.com/xelab04/hopeops.git
      targetRevision: main
      ref: values

    - repoURL: https://l7mp.io/stunner
      chart: stunner
      # 1.1.1 bundles pre-v1.5.0 Gateway API CRDs, which the cluster's
      # safe-upgrades policy rejects. 1.2.1 supports disabling both CRD
      # bundles (see values.yaml) so only STUNner's own CRDs install.
      targetRevision: 1.2.1
      helm:
        releaseName: stunner
        valueFiles:
          - $values/manifests/system/stunner-operator/values.yaml
        ignoreMissingValueFiles: false
  syncPolicy:
    automated:
      enabled: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideAppy=true
