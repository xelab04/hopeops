apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: livekit
  annotations:
    cert-manager.io/cluster-issuer: "prod-issuer"
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - livekit.nyanyamachine.dev
    secretName: livekit-tls
  rules:
  - host: livekit.nyanyamachine.dev
    http:
      paths:
      # lk-jwt-service owns the Matrix RTC auth endpoints (like friend's
      # HTTPRoute: /sfu/get, /healthz, /get_token -> lk-jwt-service:8081).
      - path: /sfu/get
        pathType: Prefix
        backend:
          service:
            name: lk-jwt-service
            port:
              number: 8081
      - path: /get_token
        pathType: Prefix
        backend:
          service:
            name: lk-jwt-service
            port:
              number: 8081
      - path: /healthz
        pathType: Prefix
        backend:
          service:
            name: lk-jwt-service
            port:
              number: 8081
      - path: /
        pathType: Prefix
        backend:
          service:
            name: livekit
            port:
              number: 7880
