# LiveKit config, adapted from
# https://github.com/fhoekstra/home-ops/commit/9df4c331ce4c165c867e164f6de9280a840df48b
# (livekit/livekit-config.yaml).
#
# Generate once:
#   openssl rand -hex 16  # -> LIVEKIT_API_KEY (short, e.g. devkey style)
#   openssl rand -hex 32  # -> LIVEKIT_API_SECRET
#   openssl rand -hex 32  # -> STUNNER_SHARED_SECRET (must match
#                           manifests/system/stunner/secret.yaml)
# Then copy this file to secret.yaml with real values (secret.yaml is the
# live file, like mautrix-telegram/secret.yaml).
#
# apiVersion: v1
# kind: Secret
# metadata:
#   name: livekit-config
# type: Opaque
# stringData:
#   livekit.yaml: |
#     port: 7880
#     bind_addresses:
#       - ""
#     rtc:
#       tcp_port: 7881
#       port_range_start: 50000
#       port_range_end: 60000
#       ips:
#         includes:
#           - "10.42.0.0/16"  # pod CIDR (traefik trusts 10.42.0.0/16)
#       stun_servers:
#         - turn.nyanyamachine.dev:13478
#       turn_servers:
#         - host: turn.nyanyamachine.dev
#           port: 15349
#           protocol: tls
#           secret: "PUT_STUNNER_SHARED_SECRET_HERE"
#         - host: turn.nyanyamachine.dev
#           port: 13478
#           protocol: udp
#           secret: "PUT_STUNNER_SHARED_SECRET_HERE"
#       use_external_ip: false
#       enable_loopback_candidate: false
#     room:
#       auto_create: false
#     turn:
#       enabled: false
#     log_level: info
#     keys:
#       PUT_LIVEKIT_API_KEY_HERE: "PUT_LIVEKIT_API_SECRET_HERE"
