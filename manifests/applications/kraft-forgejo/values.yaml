containerSecurityContext:
  allowPrivilegeEscalation: false
  privileged: false
  readOnlyRootFilesystem: true
  runAsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000

ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: "prod-issuer"
  hosts:
    - host: git.kraftcloud.dev
      paths:
        - path: /
          pathType: Prefix
          port: http
  tls:
    - secretName: kraft-forgejo-tls
      hosts:
        - git.kraftcloud.dev

resources:
  requests:
    cpu: 100m
    memory: 300Mi
  limits:
    memory: 500Mi

persistence:
  enabled: true
  create: true
  mount: true
  claimName: gitea-shared-storage
  size: 10Gi
  accessModes:
    - ReadWriteOnce
  storageClass:
  subPath:
  volumeName: ''
  annotations:
    helm.sh/resource-policy: keep

gitea:
  config:
    APP_NAME: Forgejo
    RUN_MODE: prod
    APP_SLOGAN: For Digital Sovereignty <3
    RUN_USER: git
    WORK_PATH: /data/gitea

    server:
      APP_DATA_PATH: /data/gitea
      DOMAIN: git.kraftcloud.dev
      SSH_DOMAIN: git.kraftcloud.dev
      HTTP_PORT: 3000
      ROOT_URL: https://git.kraftcloud.dev
      DISABLE_SSH: false
      SSH_PORT: 22
      SSH_LISTEN_PORT: 22
      LFS_START_SERVER: true
      OFFLINE_MODE: true

    database:
      DB_TYPE: postgres
      HOST: main-postgres-rw.cnpg.svc.cluster.local
      NAME: forgejo
      USER: forgejo

    additionalConfigFromEnvs:
      - name: FORGEJO__DATABASE_PASSWD
        valueFrom:
          secretKeyRef:
            name: postgres-secret
            key: password

    indexer:
      ISSUE_INDEXER_PATH: /data/gitea/indexers/issues.bleve

    session:
      PROVIDER_CONFIG: /data/gitea/sessions
      PROVIDER: file

    picture:
      AVATAR_UPLOAD_PATH: /data/gitea/avatars
      REPOSITORY_AVATAR_UPLOAD_PATH: /data/gitea/repo-avatars

    attachment:
      PATH: /data/gitea/attachments

    log:
      MODE: console
      LEVEL: info
      ROOT_PATH: /data/gitea/log

    security:
      INSTALL_LOCK: true
      REVERSE_PROXY_LIMIT: 1
      REVERSE_PROXY_TRUSTED_PROXIES: '*'
      PASSWORD_HASH_ALGO: pbkdf2_hi

    service:
      DISABLE_REGISTRATION: true
      REQUIRE_SIGNIN_VIEW: false
      REGISTER_EMAIL_CONFIRM: false
      ENABLE_NOTIFY_MAIL: false
      ALLOW_ONLY_EXTERNAL_REGISTRATION: false
      ENABLE_CAPTCHA: false
      DEFAULT_KEEP_EMAIL_PRIVATE: false
      DEFAULT_ALLOW_CREATE_ORGANIZATION: true
      DEFAULT_ENABLE_TIMETRACKING: true

    lfs:
      PATH: '/data/git/lfs'

    mailer:
      ENABLED: false

    openId:
      ENABLE_OPENID_SIGNIN: false
      ENABLE_OPENID_SIGNUP: false

    cron.update_checker:
      ENABLED: true

    repository:
      ROOT: '/data/git/repositories'
    repository.upload:
      TEMP_PATH: '/data/gitea/uploads'
    repository.pull-request:
      WORK_IN_PROGRESS_PREFIXES: 'WIP:,[WIP]:'
      DEFAULT_MERGE_STYLE: 'merge'
    repository.signing:
      DEFAULT_TRUST_MODEL: 'committer'
