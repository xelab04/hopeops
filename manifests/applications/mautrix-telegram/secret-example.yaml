# Where the values come from:
# - API_ID / API_HASH .... https://my.telegram.org/apps ("App api_id / api_hash")
# - AS_TOKEN / HS_TOKEN ... generate once with `mautrix-telegram -g`
#                            (run the image locally against a copy of config.yaml).
#                            MUST match registration.yaml used in the
#                            `!admin appservices register` step.
# - DATABASE_URI .......... postgres://mautrix-telegram:password@main-postgres-rw.cnpg.svc.cluster.local:5432/mautrix-telegram
#                            (password = secret created for the mautrix-telegram
#                            DatabaseRole in manifests/system/cnpg/)
# - PROVISIONING_SECRET .... random string, min 16 chars, e.g. `openssl rand -hex 16`
#                            (or: python3 -c "import secrets; print(secrets.token_hex(16))")
# - PICKLE_KEY ............. random string generated ahead of time, e.g.
#                            `openssl rand -base64 48`
#                            (or: python3 -c "import secrets; print(secrets.token_urlsafe(48))")
#                            Pre-generate it rather than using "generate": the
#                            Deployment mounts the config read-only, so the bridge
#                            could not persist an auto-generated key and crypto
#                            would break on every restart.
#

# apiVersion: v1
# kind: Secret
# metadata:
#   name: mautrix-telegram
# type: Opaque
# stringData:
#   AS_TOKEN: "PUT_GENERATED_AS_TOKEN_HERE"
#   HS_TOKEN: "PUT_GENERATED_HS_TOKEN_HERE"
#   API_ID: "12345"
#   API_HASH: "PUT_API_HASH_HERE"
#   DATABASE_URI: "postgres://mautrix-telegram:PUT_PASSWORD_HERE@main-postgres-rw.cnpg.svc.cluster.local:5432/mautrix-telegram?sslmode=require"
#   PROVISIONING_SECRET: "PUT_RANDOM_32CHARS_HERE"
#   PICKLE_KEY: "generate"
