apiVersion: v1
kind: ConfigMap
metadata:
  name: renovate-config
data:
  config.json: |-
    {
      "repositories": ["xelab04/hopeops"],
      "kubernetes": {
        "managerFilePatterns": ["/\\.ya?ml$/"]
      },
      "packageRules": [
        {
          "matchDatasources": ["docker"],
          "matchPackageNames": ["!ghcr.io/**", "!registry.alexbissessur.dev/**"],
          "registryUrls": ["https://mirror.gcr.io"]
        }
      ]
    }

