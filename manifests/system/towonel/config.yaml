apiVersion: v1
kind: ConfigMap
metadata:
  name: towonel-hostnames
data:
  TOWONEL_SELF_SERVICES: |
      [
        {"hostname":"alexbissessur.dev","origin":"traefik.traefik-system.svc.cluster.local:443"},
        {"hostname":"*.alexbissessur.dev","origin":"traefik.traefik-system.svc.cluster.local:443"},
        {"hostname":"nyanyamachine.dev","origin":"traefik.traefik-system.svc.cluster.local:443"},
        {"hostname":"*.nyanyamachine.dev","origin":"traefik.traefik-system.svc.cluster.local:443"}
      ]
  # Raw TURN ports forwarded from the VPS edge (102.222.105.35) to the
  # STUNner service
  TOWONEL_SELF_TCP_SERVICES: |
      [
        {"name":"stunner-turns-tls","origin":"stunner.stunner.svc.cluster.local:15349","listen_port":15349}
      ]
  TOWONEL_SELF_UDP_SERVICES: |
      [
        {"name":"stunner-turn-udp","origin":"stunner.stunner.svc.cluster.local:13478","listen_port":13478}
      ]
  TOWONEL_KRAFT_SERVICES: |
      [
        {"hostname":"kraftcloud.dev","origin":"traefik.traefik-system.svc.cluster.local:443"},
        {"hostname":"*.kraftcloud.dev","origin":"traefik.traefik-system.svc.cluster.local:443"}
      ]
  TOWONEL_COMMUNITY_SERVICES: |
      [
        {"hostname":"cloudnativemauritius.com","origin":"traefik.traefik-system.svc.cluster.local:443"},
        {"hostname":"*.cloudnativemauritius.com","origin":"traefik.traefik-system.svc.cluster.local:443"},
        {"hostname":"meetup.mu","origin":"traefik.traefik-system.svc.cluster.local:443"},
        {"hostname":"*.meetup.mu","origin":"traefik.traefik-system.svc.cluster.local:443"}
      ]

